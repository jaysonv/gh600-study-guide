<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GH-600 Exam Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-4xl">
        <header class="mb-8 border-b pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-blue-600">GH-600: Agentic AI Developer Simulator</h1>
                <p class="text-sm text-gray-500 mt-1">Simulated Exam Mode</p>
            </div>
            <span id="progress" class="text-sm font-semibold bg-blue-100 text-blue-800 py-1 px-3 rounded-full"></span>
        </header>

        <!-- Exam UI -->
        <div id="quiz-container">
            <div class="mb-2 text-sm font-bold text-gray-500 uppercase tracking-wide" id="domain-text"></div>
            <h2 id="question-text" class="text-xl font-medium mb-6">Loading question...</h2>
            
            <div id="options-container" class="space-y-3">
                <!-- Options injected via JS -->
            </div>
            
            <div class="mt-8 flex justify-between items-center pt-4 border-t">
                <button id="prev-btn" class="px-6 py-2 border border-gray-300 rounded-md hover:bg-gray-50 disabled:opacity-50 transition-colors">
                    Previous
                </button>
                <button id="next-btn" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md transition-colors">
                    Next
                </button>
                <button id="submit-btn" class="hidden px-6 py-2 bg-green-600 hover:bg-green-700 text-white font-bold rounded-md transition-colors shadow-md">
                    Submit Exam
                </button>
            </div>
        </div>

        <!-- Results UI -->
        <div id="results-container" class="hidden">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold mb-2">Exam Evaluation</h2>
                <div id="pass-fail-badge" class="inline-block text-lg font-bold py-2 px-6 rounded-full mb-4"></div>
                <p id="score-text" class="text-xl text-gray-700"></p>
            </div>
            
            <h3 class="text-xl font-bold border-b pb-2 mb-4">Detailed Review</h3>
            <div id="review-container" class="space-y-6 max-h-[500px] overflow-y-auto pr-2">
                <!-- Detailed feedback injected here -->
            </div>

            <div class="mt-8 text-center pt-4 border-t">
                <button onclick="location.reload()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded shadow-md transition-colors">
                    Start New Exam Session
                </button>
            </div>
        </div>
    </div>

    <script src="questions.js"></script>
    <script src="app.js"></script>
</body>
</html>
